name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      UNUSED_ERROR: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get update
          sudo apt install -y build-essential libpng-dev libelf-dev libgtk-3-dev jq curl zip

      - name: ROM
        id: rom
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j8 -O all

      - name: Send build failure notification to Discord
        if: steps.rom.outcome == 'failure'
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [ {
                   \"title\": \"CI Build Failure\",
                   \"description\": \"CI has failed build.\",
                   \"color\": 16711680,
                   \"fields\": [
                     {
                       \"name\": \"Commit hash:\",
                       \"value\": \"[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\",
                       \"inline\": false
                     },
                     {
                       \"name\": \"Committed by:\",
                       \"value\": \"[${{ github.actor }}](https://github.com/${{ github.actor }})\",
                       \"inline\": false
                     },
                     {
                       \"name\": \"Workflow run:\",
                       \"value\": \"[View workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\",
                       \"inline\": false
                     }
                   ]
                 }]
               }" \
               ${{ secrets.DISCORD_BUILD_SECRET }}

      - name: Zip the ROM
        shell: bash
        run: |
          COMMIT_HASH="${GITHUB_SHA:0:7}"
          cp pokerevelation.gba pokerevelation_${COMMIT_HASH}.gba
          zip Pokemon_Revelation.zip pokerevelation_${COMMIT_HASH}.gba
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

      - name: Upload to Pixeldrain
        id: upload
        run: |
          echo "Uploading Pokemon_Revelation.zip to Pixeldrain..."
          RESPONSE=$(curl -s -u user:${{ secrets.PXDRAN_API }} -F "file=@Pokemon_Revelation.zip" https://pixeldrain.com/api/file)
          echo "Pixeldrain raw response:"
          echo "$RESPONSE" | jq .
          DOWNLOAD_ID=$(echo "$RESPONSE" | jq -r '.id')
          DOWNLOAD_URL="https://pixeldrain.com/api/file/${DOWNLOAD_ID}?download"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV

      - name: Send patch creation notification to Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [ {
                   \"title\": \"Patch created!\",
                   \"color\": 65280,
                   \"fields\": [
                     {
                       \"name\": \"Download:\",
                       \"value\": \"[__**Click here**__](${{ env.DOWNLOAD_URL }})\",
                       \"inline\": false
                     },
                     {
                       \"name\": \"Commit hash:\",
                       \"value\": \"[\`${{ env.COMMIT_HASH }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\",
                       \"inline\": false
                     }
                   ]
                 }]
               }" \
               ${{ secrets.DISCORD_PATCH_SECRET }}

      - name: Test
        id: test
        env:
          TEST: 1
        run: make -j$(nproc) check

      - name: Send tests failure notification to Discord
        if: steps.test.outcome == 'failure'
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"embeds\": [ {
                   \"title\": \"CI Tests Failure\",
                   \"description\": \"CI job failed test.\",
                   \"color\": 16711680,
                   \"fields\": [
                     {
                       \"name\": \"Commit hash:\",
                       \"value\": \"[${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\",
                       \"inline\": false
                     },
                     {
                       \"name\": \"Committed by:\",
                       \"value\": \"[${{ github.actor }}](https://github.com/${{ github.actor }})\",
                       \"inline\": false
                     },
                     {
                       \"name\": \"Workflow run:\",
                       \"value\": \"[View workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\",
                       \"inline\": false
                     }
                   ]
                 }]
               }" \
               ${{ secrets.DISCORD_BUILD_SECRET }}
